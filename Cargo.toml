[package]
name = "strongbox"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
diesel = { version = "2.2.0", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs"] }
serde_json = "1.0.151"
