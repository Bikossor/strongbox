[package]
name = "strongbox"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
tokio = { version = "1.0", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs"] }
serde_json = "1.0.151"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
sea-orm = { version = "2.0.0", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
uuid = { version = "1.25.0", features = ["serde", "v4"] }
jsonwebtoken = "11.0.0"
